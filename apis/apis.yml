# GitHub REST API — Actions and Checks. VENDORED, TRIMMED spec: the official
# github/rest-api-description document is 13MB and ~1000 operations; the sibling file
# holds the seven operations this realm uses plus their $ref closure (77KB).
# To add an operation, regenerate from the official spec with
#   python3 scripts/trim-openapi.py <full-spec.json> apis/api.github.com.json <op-id>,<op-id>   (comma-separated)
#
# Auth: a token in GH_TOKEN — the name `gh auth` itself exports, and the one realm-npm reads.
# A fine-grained PAT with `Actions: read` and `Checks: read` on the repositories you will ask
# about (Metadata: read comes with it), or a classic token with `repo`. Public repositories
# read with any token. The Docker appliance forwards GH_TOKEN from the shell that ran
# `docker compose up`, or takes it from secrets.env beside the compose file; the realm never
# carries it.
#
# Every operation here is a GET. The realm cannot cancel, re-run or dispatch anything.
- url: api.github.com.json
  name: github_actions
  type: openapi
  auth: bearer
  token-env: GH_TOKEN
  headers:
    Accept: "application/vnd.github+json"
    X-GitHub-Api-Version: "2022-11-28"
  operation-ids:
    - actions/list-workflow-runs-for-repo   # GET /repos/{owner}/{repo}/actions/runs
    - actions/list-jobs-for-workflow-run    # GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs
    - actions/list-repo-workflows           # GET /repos/{owner}/{repo}/actions/workflows
    - checks/list-annotations               # GET /repos/{owner}/{repo}/check-runs/{check_run_id}/annotations
    - actions/get-workflow-run-usage        # GET /repos/{owner}/{repo}/actions/runs/{run_id}/timing
    - repos/get-commit                      # GET /repos/{owner}/{repo}/commits/{ref} — the commit a run built, with its files
    - actions/download-job-logs-for-workflow-run   # GET .../actions/jobs/{job_id}/logs — the raw log, for the resolution lens
