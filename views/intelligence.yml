# Intelligence views: a model reads the rows the deterministic views produce and says what
# they mean. Each costs model calls and says so in its description. The exact figures live in
# the views beside them; these compose, they do not count. Window parameters as in actions.yml.

- name: ActionsFailureThemes
  description: >-
    The recurring THEMES in recent failures: reads the failed jobs of the newest failed runs in
    a window, the step that broke and the failure annotations GitHub attached, and names the
    handful of underlying causes. "Why do our builds fail", "what are the common failure
    causes", "summarise the failures". Costs a model call; ActionsFailingSteps is the count
    underneath it.
  params:
    repo:  { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    days:  { type: int, default: 7, description: "Window in days ending now, at most 31 (the history door's depth); ignored when since is given." }
    since: { type: string, default: "1970-01-01T00:00:00Z", description: "ISO-8601 lower bound on created_at, e.g. 2026-09-16T00:00:00Z; overrides days. The history door holds 31 days, so an earlier bound is silently the 31-day floor." }
    until: { type: string, default: "9999-12-31T23:59:59Z", description: "ISO-8601 upper bound (exclusive) on created_at." }
    runs:  { type: int, default: 20, description: "How many of the newest failed runs to read (one API call each, plus one per failed job)." }
    count: { type: int, default: 5, description: "How many themes at most." }
  cypher: |
    MATCH (r:GitHubRepository {full_name: $repo})-[:HAS_RUN_HISTORY]->(run:WorkflowRun)
    WITH run, run.created_at AS createdAt, run.status AS status, run.conclusion AS conclusion, run.event AS event, run.head_branch AS branch, toInteger(run.run_attempt) AS attempt
    WHERE createdAt >= $since
      AND createdAt < $until
      AND ($since <> '1970-01-01T00:00:00Z' OR datetime(createdAt) >= datetime() - duration({days: $days}))
      AND conclusion = 'failure'
    WITH run, createdAt ORDER BY createdAt DESC LIMIT $runs
    MATCH (run)-[:HAS_JOB]->(j:WorkflowJob)
    WHERE j.conclusion = 'failure'
    OPTIONAL MATCH (j)-[:HAS_ANNOTATION]->(a:CheckAnnotation)
    WHERE a.annotation_level = 'failure'
    WITH run, j, [m IN collect(DISTINCT a.message)[0..4] | substring(m, 0, 240)] AS errors,
         [i IN range(0, size(coalesce(j.step_names, [])) - 1) WHERE j.step_conclusions[i] = 'failure' | j.step_names[i]] AS failedSteps
    WITH CASE WHEN run.path STARTS WITH 'dynamic/' THEN 'dynamic: ' + split(run.path, '/')[1] ELSE run.name END + ' / ' + j.name + ' on ' + run.head_branch + ' (' + run.event + '): failed at step ' +
         CASE WHEN size(failedSteps) = 0 THEN 'unknown'
              ELSE reduce(s = '', x IN failedSteps | s + CASE WHEN s = '' THEN '' ELSE ', ' END + x) END +
         CASE WHEN size(errors) = 0 THEN ''
              ELSE '. Errors: ' + reduce(s = '', e IN errors | s + CASE WHEN s = '' THEN '' ELSE ' | ' END + e) END
         AS fact
    RETURN themes(fact,
      'Group these CI job failures by underlying cause — the same step failing the same way across runs is one theme, however many workflows it hit. Name each theme by the cause, not the job.',
      $count) AS themes

- name: ActionsBriefing
  description: >-
    The paragraph for a standup: reads the per-workflow summary and the failing steps of a
    window and says how CI is doing, what is failing and where the time goes. "How is CI",
    "brief me on the builds", "CI status for standup". Costs a model call; every figure it
    cites comes from ActionsWorkflowSummary and ActionsFailingSteps.
  params:
    repo: { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    days:  { type: int, default: 7, description: "Window in days ending now, at most 31 (the history door's depth); ignored when since is given." }
    since: { type: string, default: "1970-01-01T00:00:00Z", description: "ISO-8601 lower bound on created_at, e.g. 2026-09-16T00:00:00Z; overrides days. The history door holds 31 days, so an earlier bound is silently the 31-day floor." }
    until: { type: string, default: "9999-12-31T23:59:59Z", description: "ISO-8601 upper bound (exclusive) on created_at." }
    runs: { type: int, default: 15, description: "How many of the newest failed runs to open for the failing steps." }
  # TWO traversals of the run door, and a subtlety: every predicate on either traversal is
  # attached to the ONE shared fetch, so a `conclusion = 'failure'` on the second one narrows
  # the fetch and the summary then silently describes failed runs only (wrapping it in a
  # function does not help). The second traversal therefore carries no conclusion predicate
  # at all: it sorts failures first and LIMITs, and the jobs hop filters failed jobs. If the
  # window holds fewer failed runs than `runs`, a few passing runs have their jobs opened and
  # contribute nothing. And the jobs hop must start from a pattern-bound run: a node re-bound
  # from a collected list is not probed for its joins.
  cypher: |
    MATCH (r:GitHubRepository {full_name: $repo})-[:HAS_RUN_HISTORY]->(run:WorkflowRun)
    WITH run, run.created_at AS createdAt, run.status AS status, run.conclusion AS conclusion, run.event AS event, run.head_branch AS branch, toInteger(run.run_attempt) AS attempt
    WHERE createdAt >= $since
      AND createdAt < $until
      AND ($since <> '1970-01-01T00:00:00Z' OR datetime(createdAt) >= datetime() - duration({days: $days}))
      AND status = 'completed'
    WITH CASE WHEN run.path STARTS WITH 'dynamic/' THEN 'dynamic: ' + split(run.path, '/')[1] ELSE run.name END AS workflow, run,
         duration.inSeconds(datetime(run.run_started_at), datetime(run.updated_at)).seconds AS runSeconds,
         duration.inSeconds(datetime(run.created_at), datetime(run.run_started_at)).seconds AS queueSeconds
    WITH workflow, count(run) AS runs,
         sum(CASE WHEN run.conclusion = 'failure' THEN 1 ELSE 0 END) AS failed,
         round(avg(runSeconds) / 60.0, 1) AS avgMin, round(max(runSeconds) / 60.0, 1) AS maxMin,
         round(avg(queueSeconds), 0) AS avgQueue
    WITH collect('Workflow "' + workflow + '": ' + toString(runs) + ' completed runs, of which ' +
                 toString(failed) + ' failed (' + toString(round(100.0 * failed / runs, 1)) +
                 '% failure rate); average run time ' + toString(avgMin) + ' min, longest ' +
                 toString(maxMin) + ' min, average queue ' + toString(avgQueue) + ' s') AS summaryFacts
    MATCH (r2:GitHubRepository {full_name: $repo})-[:HAS_RUN_HISTORY]->(f:WorkflowRun)
    WITH summaryFacts, f, f.created_at AS fCreatedAt
    WHERE fCreatedAt >= $since AND fCreatedAt < $until
      AND ($since <> '1970-01-01T00:00:00Z' OR datetime(fCreatedAt) >= datetime() - duration({days: $days}))
    WITH summaryFacts, f, fCreatedAt, CASE WHEN f.conclusion = 'failure' THEN 0 ELSE 1 END AS failedFirst
    ORDER BY failedFirst, fCreatedAt DESC
    LIMIT $runs
    MATCH (f)-[:HAS_JOB]->(j:WorkflowJob)
    WHERE j.conclusion = 'failure'
    WITH summaryFacts,
         CASE WHEN f.path STARTS WITH 'dynamic/' THEN 'dynamic: ' + split(f.path, '/')[1] ELSE f.name END + '" job "' + j.name AS failingJob,
         reduce(s = '', x IN [i IN range(0, size(coalesce(j.step_names, [])) - 1) WHERE j.step_conclusions[i] = 'failure' | j.step_names[i]] | s + CASE WHEN s = '' THEN '' ELSE ', ' END + x) AS steps,
         count(*) AS n
    WITH summaryFacts, collect('Among the failed runs opened, workflow "' + failingJob + '" failed ' + toString(n) +
                               ' time(s) at step ' + CASE WHEN steps = '' THEN 'unknown' ELSE '"' + steps + '"' END) AS failureFacts
    UNWIND summaryFacts + failureFacts AS fact
    RETURN synthesize(fact,
      'You are briefing an engineering team at standup on their GitHub Actions CI over a recent window, using ONLY these facts. Read each fact carefully: "N completed runs, of which M failed" means M out of N, not all. In under 140 words: say whether CI is healthy, name the workflow with the worst failure rate and the one that takes longest, say what is failing most and at which step, and suggest the one thing to look at first. Cite the numbers. Never mention a workflow, job or step not listed. No preamble.'
    ) AS briefing
