# The graph this realm reads off a repository:
#
#   (GitHubRepository {full_name})
#      -[:HAS_WORKFLOW]->      (Workflow)
#      -[:HAS_WORKFLOW_RUN]->  (WorkflowRun)
#            -[:HAS_JOB]->            (WorkflowJob)
#                  -[:HAS_ANNOTATION]->    (CheckAnnotation)
#
# Nothing is mirrored. Every hop is a virtual join fetched at query time and rolled back.
# Producer values arrive as STRINGS: views use toInteger()/toFloat()/datetime() on them.
#
# Every join is declared under the type it PRODUCES, with anchorLabel naming where it starts.

- name: GitHubRepository
  visibility: internal
  userAnchor: false
  description: "A GitHub repository. Pin it as a single literal {full_name:'owner/repo'} (e.g. {full_name:'embabel/embabel-agent'}) and traverse HAS_WORKFLOW_RUN for its Actions runs or HAS_WORKFLOW for its workflows. The same label realm-github anchors issues on, so both realms meet on one node."
  properties:
    full_name:
      description: "The repository's ONLY identity, 'owner/repo'. Pin a repo as a SINGLE literal — there are no separate owner/name properties. The producers split it into the owner and repo path parameters."
      metadata:
        identity: "true"

- name: Workflow
  visibility: internal
  userAnchor: false
  description: "A workflow definition in a repository — the file under .github/workflows, or a dynamic one GitHub runs itself (Dependabot, Copilot). Reached from GitHubRepository via HAS_WORKFLOW. For runs, traverse HAS_WORKFLOW_RUN from the repository and filter on run.name or run.path; runs are not fetched per workflow."
  virtualJoins:
    - anchorLabel: GitHubRepository
      relationship: HAS_WORKFLOW
      keyField: full_name
      recordKeyField: repository
      producer: workflowsByRepo
      description: "Every workflow the repository defines, active or disabled."
  properties:
    id:
      description: "GitHub's numeric workflow id, held as a string."
      metadata:
        identity: "true"
    name: "The workflow's display name, e.g. 'Build'. WorkflowRun.name carries the same value."
    path: "The workflow file path, e.g. .github/workflows/maven.yml, or a dynamic/... path for GitHub-run workflows."
    state: "active, disabled_manually, disabled_inactivity, or similar."
    html_url: "Link to the workflow on GitHub."
    repository: "The 'owner/repo' this was fetched for — the join link back to the repository."

- name: WorkflowRun
  visibility: internal
  userAnchor: false
  description: "One run of a workflow, newest first, latest attempt only. Reached from GitHubRepository via HAS_WORKFLOW_RUN — up to the 1,000 most recent runs (10 pages of 100); a window older than that is reported PARTIAL. Timestamps are ISO strings: run time is updated_at minus run_started_at for a completed run; queue time is run_started_at minus created_at. conclusion is null while status is not 'completed'. A question that names NO repository means every followed repository: start at (w:ActionsWatch)-[:HAS_RUN_HISTORY]->(run) and group by w.full_name; a bare (r:GitHubRepository) with no full_name matches nothing. Filter on PROJECTED variables (WITH run, run.created_at AS createdAt, run.status AS status WHERE …), never on run.<property> directly, and limit by collect + list slice rather than LIMIT — that is what lets the query share the cached history instead of re-reading GitHub. On HAS_WORKFLOW_RUN (live) a literal created_at lower bound is pushed to GitHub."
  virtualJoins:
    - anchorLabel: GitHubRepository
      relationship: HAS_WORKFLOW_RUN
      keyField: full_name
      recordKeyField: repository
      producer: runsByRepo
      maxFanoutTotal: 10000
      description: "The repository's runs read LIVE, newest first, with a literal created_at lower bound pushed to GitHub — the door for 'right now': the newest runs, is main red, this run's jobs. For a window of days use HAS_RUN_HISTORY, which is cached per day."
    - anchorLabel: GitHubRepository
      relationship: HAS_RUN_HISTORY
      keyField: full_name
      recordKeyField: repository
      producer: runRecentByRepo
      maxFanoutTotal: 40000
      description: "The last 31 days of runs as calendar days plus the whole previous month (the same relationship, two producers): closed periods cached for 400 days, only today re-read every 30 minutes. The door for any question over a window: 'how are our builds doing', 'slowest builds this week', 'builds per day', 'flaky jobs this month'. Use HAS_WORKFLOW_RUN instead for 'right now' (newest runs, is main red)."
    - anchorLabel: GitHubRepository
      relationship: HAS_RUN_HISTORY
      keyField: full_name
      recordKeyField: repository
      producer: runHistoryByRepo
      maxFanoutTotal: 40000
      description: "The previous calendar month's runs, closed and cached — the older half of HAS_RUN_HISTORY."
    # The SECOND door: the same runs off a followed repository (a stored ActionsWatch node), so
    # one query can sweep every repository on the watchlist — 'which mains are broken'.
    - anchorLabel: ActionsWatch
      relationship: HAS_WORKFLOW_RUN
      keyField: full_name
      recordKeyField: repository
      producer: runsByRepo
      maxAnchors: 50
      maxFanoutTotal: 50000
      description: "The recent runs of every followed repository at once, read live."
    - anchorLabel: ActionsWatch
      relationship: HAS_RUN_HISTORY
      keyField: full_name
      recordKeyField: repository
      producer: runRecentByRepo
      maxAnchors: 50
      maxFanoutTotal: 200000
      description: "The last 31 days of runs of every followed repository at once, from the cached history — the door for 'which mains are broken', 'which PRs are red', 'how is CI across our repos'."
    - anchorLabel: ActionsWatch
      relationship: HAS_RUN_HISTORY
      keyField: full_name
      recordKeyField: repository
      producer: runHistoryByRepo
      maxAnchors: 50
      maxFanoutTotal: 200000
      description: "The previous month's runs of every followed repository — the older half."
  examples:
    - q: "how many workflow runs did embabel/embabel-agent have in the last 7 days"
      cypher: |
        MATCH (r:GitHubRepository {full_name: 'embabel/embabel-agent'})-[:HAS_RUN_HISTORY]->(run:WorkflowRun)
        WITH run, run.created_at AS createdAt, run.conclusion AS conclusion
        WHERE datetime(createdAt) >= datetime() - duration({days: 7})
        RETURN count(run) AS runs, sum(CASE WHEN conclusion = 'failure' THEN 1 ELSE 0 END) AS failed
    - q: "what is the average build time"
      cypher: |
        MATCH (w:ActionsWatch)-[:HAS_RUN_HISTORY]->(run:WorkflowRun)
        WITH w, run, run.created_at AS createdAt, run.status AS status
        WHERE datetime(createdAt) >= datetime() - duration({days: 7}) AND status = 'completed'
        WITH w.full_name AS repo, duration.inSeconds(datetime(run.run_started_at), datetime(run.updated_at)).seconds AS runSeconds
        RETURN repo, count(*) AS runs, round(avg(runSeconds) / 60.0, 1) AS avgRunMinutes
    - q: "which build in embabel/embabel-agent took the longest in the last 7 days"
      cypher: |
        MATCH (r:GitHubRepository {full_name: 'embabel/embabel-agent'})-[:HAS_RUN_HISTORY]->(run:WorkflowRun)
        WITH run, run.created_at AS createdAt, run.status AS status
        WHERE datetime(createdAt) >= datetime() - duration({days: 7}) AND status = 'completed'
        WITH run, duration.inSeconds(datetime(run.run_started_at), datetime(run.updated_at)).seconds AS runSeconds
        ORDER BY runSeconds DESC
        WITH collect({runId: toInteger(run.id), workflow: run.name, title: run.display_title, runSeconds: runSeconds, url: run.html_url}) AS rows
        UNWIND rows[0..5] AS row
        RETURN row.runId AS runId, row.workflow AS workflow, row.title AS title, row.runSeconds AS runSeconds, row.url AS url
    - q: "why was run 35703978620 in embabel/embabel-agent slow"
      cypher: |
        MATCH (r:GitHubRepository {full_name: 'embabel/embabel-agent'})-[:HAS_RUN_HISTORY]->(run:WorkflowRun)
        WITH run, CASE WHEN toInteger(run.id) = 35703978620 THEN 0 ELSE 1 END AS pick
        ORDER BY pick LIMIT 1
        MATCH (run)-[:HAS_JOB]->(j:WorkflowJob)
        WITH j, pick WHERE pick = 0
        RETURN j.name AS job, j.conclusion AS conclusion,
               duration.inSeconds(datetime(j.started_at), datetime(j.completed_at)).seconds AS jobSeconds,
               [i IN range(0, size(coalesce(j.step_names, [])) - 1) WHERE j.step_conclusions[i] = 'failure' | j.step_names[i]] AS failedSteps
        ORDER BY jobSeconds DESC
  properties:
    id:
      description: "GitHub's numeric run id, held as a STRING — compare with toInteger(run.id) = 35703978620 or run.id = '35703978620', never a bare number. The id in the run's URL; the key its jobs are fetched by."
      metadata:
        identity: "true"
    name: "The workflow's name, e.g. 'Build'."
    workflow_id:
      description: "Numeric id of the Workflow this is a run of."
    path: "The workflow file that ran."
    display_title: "What GitHub shows as the run's title — the commit or PR title."
    head_branch: "Branch the run was for, e.g. main."
    head_sha: "Commit the run built."
    event: "What triggered it: push, pull_request, schedule, workflow_dispatch, ..."
    status: "queued, in_progress, completed, ..."
    conclusion: "success, failure, cancelled, skipped, timed_out, action_required, or null until completed."
    run_number:
      description: "The run's sequence number within its workflow."
    run_attempt:
      description: "1 for a first run; higher means it was re-run. A success with run_attempt > 1 passed on retry."
    created_at: "When the run was requested (ISO 8601)."
    run_started_at: "When the latest attempt started executing (ISO 8601). Minus created_at is time spent queued."
    updated_at: "Last change; for a completed run, when it finished (ISO 8601)."
    html_url: "Link to the run on GitHub."
    actor: "Login of the user whose action triggered the run."
    month: "Calendar month (UTC, YYYY-MM) this run was fetched under when it came from the previous-month producer; absent otherwise."
    day: "Calendar day (UTC, YYYY-MM-DD) this run was fetched under when it came from the last-31-days producer; absent otherwise."
    pr_numbers: "Pull request numbers GitHub linked to the run (often empty for runs from forks; display_title then carries the PR title and head_branch its branch)."
    owner: "Repository owner login — with repo and id, the key the run's jobs are fetched by."
    repo: "Repository name (without the owner)."
    repository: "The 'owner/repo' this was fetched for — the join link back to the repository."

- name: WorkflowJob
  visibility: internal
  userAnchor: false
  description: "One job of a run — the unit that ran on a runner, e.g. 'build (ubuntu-latest)'. Reached from WorkflowRun via HAS_JOB, ALL attempts included, so a job name appearing with both 'failure' and 'success' under one run passed on retry. One API call per run: narrow the runs (LIMIT, a conclusion, a window) BEFORE this hop. step_names and step_conclusions are parallel lists; a failed step is a name whose conclusion is 'failure'."
  virtualJoins:
    - anchorLabel: WorkflowRun
      relationship: HAS_JOB
      producerKeyFields: [owner, repo, id]
      recordKeyField: runKey
      producer: jobsByRun
      maxAnchors: 100
      maxFanoutTotal: 5000
      description: "The jobs under a run — for 'why was this run slow', 'which job failed', 'which step broke'."
  properties:
    id:
      description: "GitHub's numeric job id, held as a string. It is also the check-run id its annotations hang off."
      metadata:
        identity: "true"
    run_id:
      description: "The run this job belongs to."
    runKey: "The composite repository+run key this job was fetched under — the join link back to its run."
    run_attempt:
      description: "Which attempt of the run this job ran in."
    name: "Job name as the workflow defines it, matrix suffix included."
    status: "queued, in_progress, completed."
    conclusion: "success, failure, cancelled, skipped, or null until completed."
    started_at: "When the job started on a runner (ISO 8601)."
    completed_at: "When it finished (ISO 8601). Minus started_at is the job's run time."
    runner_name: "The runner that ran it."
    runner_group_name: "The runner group."
    labels: "Runner labels requested, e.g. ubuntu-latest."
    workflow_name: "Name of the workflow this job's run belongs to."
    head_branch: "Branch of the run."
    html_url: "Link to the job's log on GitHub."
    step_names: "The job's step names, in order. Parallel to step_conclusions."
    step_conclusions: "Each step's conclusion (success, failure, skipped, cancelled), parallel to step_names. The failed steps are the names at the positions whose conclusion is 'failure' — see the ActionsRunJobs view for the expression."

- name: CheckAnnotation
  visibility: internal
  userAnchor: false
  description: "An annotation GitHub attached to a job's check run — the '##[error]' and '##[warning]' lines a step emitted, with annotation_level failure, warning or notice. Reached from WorkflowJob via HAS_ANNOTATION; one API call per job, so narrow to failed jobs first. The failure-level messages are the closest thing to 'why it failed' without reading the log."
  virtualJoins:
    - anchorLabel: WorkflowJob
      relationship: HAS_ANNOTATION
      producerKeyFields: [runKey, id]
      recordKeyField: jobKey
      producer: annotationsByJob
      maxAnchors: 60
      maxFanoutTotal: 3000
      description: "The error and warning annotations on a job — for 'what did the failure say', 'common failures'."
  properties:
    jobKey: "The composite run+job key this annotation was fetched under — the join link back to its job."
    annotation_level: "failure, warning, or notice."
    title: "Annotation title, often empty."
    message: "The annotation text, e.g. 'Process completed with exit code 1.' or a test assertion."
    path: "File the annotation points at; '.github' for the workflow itself."
    start_line:
      description: "Line in that file."
    raw_details: "Extra detail when the action supplied it."
