# HOW TO FIX THIS: a lens over one failed run. It reads the failed job's log from GitHub, pulls
# the lines around the failure marker, searches the web for the error signature, and asks a
# model for a resolution hint grounded on those lines and those pages — sources cited, and an
# honest "no clear cause in the log" when there is none. A lens rather than a view because it
# makes several calls (jobs, log, search, model) and a wasm handler cannot reach Brave or the
# model; a CypherScript lens can. Costs one GitHub log download, one web search and one model
# call per failed job it opens (at most two).
id: resolve-failure
name: How to fix this failure
description: >-
  For one failed workflow run: the error lines from the failed job's log, what the web says
  about that error, and a resolution hint grounded on both with sources. "How do I fix run
  123", "why did run 123 fail and what should I do", "resolution for this failure".
params:
  - name: repo
    type: STRING
    label: Repository (owner/repo)
    required: true
  - name: runId
    type: INT
    label: Run id
    required: true
  - name: jobId
    type: INT
    label: Job id (optional — the first failed job otherwise)
    required: false
spec:
  kind: cypherscript
  script: |
    const repoFull = String(lensArgs.repo || "");
    const [owner, repo] = repoFull.split("/");
    const runId = Number(lensArgs.runId || 0);
    const wantJob = lensArgs.jobId ? Number(lensArgs.jobId) : null;
    const out = { kind: "resolution", repo: repoFull, runId, jobs: [], note: null };
    if (!owner || !repo || !runId) { out.note = "Give a repository as owner/repo and a run id."; await gateway.lens.present({ content: JSON.stringify(out) }); return out; }

    const jobsRes = await gateway.githubActions.actionsListJobsForWorkflowRun({ owner, repo, run_id: runId, filter: "latest", per_page: 100 });
    const jobs = (jobsRes && jobsRes.jobs) || [];
    let failed = jobs.filter(j => j.conclusion === "failure");
    if (wantJob) failed = failed.filter(j => Number(j.id) === wantJob);
    if (!failed.length) { out.note = jobs.length ? "No job of this run concluded failure — nothing to resolve." : "The run has no jobs (not started, or older than GitHub keeps)."; await gateway.lens.present({ content: JSON.stringify(out) }); return out; }

    const strip = l => l.replace(/^﻿?\d{4}-\d{2}-\d{2}T[\d:.]+Z\s?/, "").replace(/\x1b\[[0-9;]*m/g, "").trim();
    const interesting = /##\[error\]|\[ERROR\]|\bERROR\b|\bFAILED\b|\bFAILURE\b|Exception|Traceback|error:|fatal:|denied|not found|No such file|timed out|Timeout|cannot |could not |Could not |missing |exit code|BUILD FAILED|Tests run:.*Failures: [1-9]|npm ERR!|✖|panic:/;
    const noise = /^Post job cleanup|##\[group\]|##\[endgroup\]|^Cleaning up|^\s*at\s+\S+\(|^\s*\.\.\. \d+ more|Run actions\//;

    for (const job of failed.slice(0, 2)) {
      const failedSteps = (job.steps || []).filter(s => s.conclusion === "failure").map(s => s.name);
      let log = "";
      try { const raw = await gateway.githubActions.actionsDownloadJobLogsForWorkflowRun({ owner, repo, job_id: Number(job.id) }); log = typeof raw === "string" ? raw : ""; } catch (e) { log = ""; }
      const lines = log.split("\n");
      const marks = []; lines.forEach((l, i) => { if (l.includes("##[error]")) marks.push(i); });
      const firstMark = marks.length ? marks[0] : Math.max(0, lines.length - 200);
      const window = lines.slice(Math.max(0, firstMark - 400), Math.min(lines.length, firstMark + 5)).map(strip);
      const seen = new Set(); const signal = [];
      for (const l of window) { if (!l || noise.test(l) || !interesting.test(l)) continue; const k = l.replace(/\d+/g, "#").slice(0, 120); if (seen.has(k)) continue; seen.add(k); signal.push(l.slice(0, 240)); }
      const errorLines = signal.slice(-30);
      // The search query: the most DIAGNOSTIC line (an exception, an assertion, a "cannot"), never
      // build-tool boilerplate ("BUILD FAILURE", "-rf :module", "Failed to execute goal"), with
      // paths, hashes, numbers and this repository's own names stripped so the web is asked about
      // the error, not about us.
      const boiler = /Process completed with exit code|##\[error\]|BUILD FAILURE|-rf :|Failed to execute goal|Tests run:|\[ERROR\] Failures:|\[ERROR\]\s*$|For more information about the errors|Re-run Maven|To see the full stack trace|-e switch|-X switch|Help 1|\[Help \d\]|\bWARN\b/;
      const diagnostic = /Exception|expected:|Expected|AssertionError|assert|error:|Cannot |cannot |Could not |could not |not found|No such file|denied|timed out|Timeout|npm ERR!|ENOENT|Traceback|panic:|fatal:/;
      const candidates = errorLines.filter(l => !boiler.test(l));
      const best = candidates.filter(l => diagnostic.test(l)).slice(-1)[0] || candidates.slice(-1)[0] || errorLines.slice(-1)[0] || "";
      const tool = /mvn|maven|\[INFO\] BUILD/.test(log) ? "maven" : /gradle/i.test(log) ? "gradle" : /npm ERR!|yarn|pnpm/.test(log) ? "npm" : /pytest|Traceback/.test(log) ? "python" : /docker/i.test(best) ? "docker" : "";
      const own = new RegExp("\\b(" + [owner, repo, repo.replace(/-/g, " ")].map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")[\\w.-]*", "gi");
      const q = (tool + " " + best.replace(/^\[?(ERROR|WARN|INFO)\]?\s*/, "").replace(/\d{2}:\d{2}:\d{2}[.\d]*\s*\[\w+\]\s*(ERROR|WARN)?\s*/, "").replace(/https?:\S+|\/[\w./-]+|[0-9a-f]{7,}|\d{2,}/g, " ").replace(own, " ").replace(/[<>"'`]/g, " ").replace(/\s+/g, " ").trim()).trim().slice(0, 160);
      let sources = [];
      if (q.length > 8) {
        try { const s = await gateway.brave.webSearch({ q, count: 5 }); const web = (s && s.web && s.web.results) || (Array.isArray(s) ? s : (s && s.results) || []); sources = web.slice(0, 5).map(r => ({ title: r.title, url: r.url, snippet: (r.description || r.snippet || "").slice(0, 300) })); } catch (e) { sources = []; }
      }
      const prompt = [
        `A GitHub Actions job failed. Repository ${repoFull}, run ${runId}, job "${job.name}", failed step(s): ${failedSteps.join(", ") || "unknown"}.`,
        `Error lines from the log (oldest first):`, ...errorLines.map(l => "  " + l),
        sources.length ? `Web pages found for the error signature "${q}":` : `No web page was found for the error signature.`,
        ...sources.map((s, i) => `  [${i + 1}] ${s.title} — ${s.url}\n      ${s.snippet}`),
        ``,
        `In under 180 words: (1) say in one sentence what actually failed, quoting the decisive log line; (2) give the most likely cause; (3) give concrete steps to fix or diagnose it, citing sources as [n] only where a source genuinely supports the step. If the log lines do not show a clear cause, say so plainly and say what to look at next. Never invent a source or a log line.`
      ].join("\n");
      let hint = "";
      try { hint = await gateway.ai.complete({ prompt }); } catch (e) { hint = "The model could not be reached: " + (e && e.message ? e.message : String(e)); }
      out.jobs.push({ jobId: Number(job.id), job: job.name, url: job.html_url, failedSteps, logLines: lines.length, errorLines, query: q, sources, hint });
    }
    await gateway.lens.present({ content: JSON.stringify(out) });
    return out;
