# Virtual-join producers over the GitHub REST API (kind: remote). Every one is a GET.
#
# KEYS ARE PATH PARAMETERS. A repository key 'owner/repo' is split positionally by keyArgs
# into the owner and repo path params (keySplit "/"), and echoKeyAs stamps it back onto each
# record because the records do not carry it in a flat field. A run or job id is a single
# path param. Path-param producers are structurally one key per call: batchSafe: false says
# so, and the engine fetches one anchor per call.
#
# PAGING. GitHub pages by `page` and `per_page` (max 100), newest first. runsByRepo walks up
# to 10 pages, so a busy repository's window is bounded at 1,000 runs and a deeper window is
# reported PARTIAL rather than silently short.
#
# PUSHDOWN. A literal predicate on head_branch, event, actor or conclusion renders into the
# endpoint's own query parameter so the fetch is scoped at GitHub. A created_at lower bound
# renders into `created` as '>=DATE'. Views that take a relative window (`days`) filter in
# the graph, because a producer argument is static and cannot say 'seven days before now'.
#
# Numeric fields are typed on the types (types/actions.yml), so they arrive as numbers.

- name: runsByRepo
  kind: remote
  operation: actions/list-workflow-runs-for-repo
  records: "$.workflow_runs[*]"
  keyArgs: [owner, repo]
  keySplit: "/"
  echoKeyAs: repository
  batchSafe: false
  args:
    per_page: 100
  paging: { style: page, param: page, sizeParam: per_page, size: 100, maxPages: 10 }
  pushdown:
    - { property: head_branch, op: EQUALS, argPath: branch, clause: "{value}" }
    - { property: event, op: EQUALS, argPath: event, clause: "{value}" }
    - { property: actor, op: EQUALS, argPath: actor, clause: "{value}" }
    - { property: conclusion, op: EQUALS, argPath: status, clause: "{value}" }
    - { property: created_at, op: GREATER_THAN_OR_EQUAL, argPath: created, clause: ">={value}" }
  project:
    id: id
    name: name
    workflow_id: workflow_id
    path: path
    display_title: display_title
    head_branch: head_branch
    head_sha: head_sha
    event: event
    status: status
    conclusion: conclusion
    run_number: run_number
    run_attempt: run_attempt
    created_at: created_at
    run_started_at: run_started_at
    updated_at: updated_at
    html_url: html_url
    actor: actor.login
    actorType: actor.type
    pr_numbers: "pull_requests[*].number"
    owner: repository.owner.login
    repo: repository.name
  compute:                           # the dev vocabulary's Build contract (realm-dev-vocabulary/types/vocabulary.yml); `r` is the run as GitHub hands it over plus what project lifted
    repositoryKey: "'github.com/' + toLower(split(r.html_url, '/')[3] + '/' + split(r.html_url, '/')[4])"
    number: "r.run_number"
    attempt: "r.run_attempt"
    status: "CASE r.status WHEN 'completed' THEN 'completed' WHEN 'in_progress' THEN 'running' ELSE 'queued' END"
    conclusion: "CASE r.conclusion WHEN 'timed_out' THEN 'timed-out' WHEN 'success' THEN 'success' WHEN 'failure' THEN 'failure' WHEN 'cancelled' THEN 'cancelled' WHEN 'skipped' THEN 'skipped' WHEN null THEN '' ELSE 'other' END"
    trigger: "CASE r.event WHEN 'push' THEN 'push' WHEN 'pull_request' THEN 'change-request' WHEN 'pull_request_target' THEN 'change-request' WHEN 'schedule' THEN 'schedule' WHEN 'workflow_dispatch' THEN 'manual' WHEN 'release' THEN 'tag' ELSE 'other' END"
    branch: "r.head_branch"
    sha: "r.head_sha"
    changeRequestKeys: "[n IN coalesce(r.pr_numbers, []) | 'github.com/' + toLower(split(r.html_url, '/')[3] + '/' + split(r.html_url, '/')[4]) + '#' + toString(n)]"
    actorLogin: "r.actor"
    actorKind: "CASE WHEN r.actorType = 'Bot' AND any(a IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(coalesce(r.actor, '')) CONTAINS a) THEN 'agent' WHEN r.actorType = 'Bot' OR coalesce(r.actor, '') ENDS WITH '[bot]' THEN 'bot' WHEN r.actorType = 'User' THEN 'human' ELSE 'unknown' END"
    queuedAt: "r.created_at"
    startedAt: "r.run_started_at"
    finishedAt: "CASE r.status WHEN 'completed' THEN r.updated_at ELSE '' END"
    sourceUrl: "r.html_url"
  cost: { bucket: github-core, rate: 5000/hour }
  cache: { kind: ttl, seconds: 600, negativeTtlSeconds: 600 }

# No pushdown: the workflows endpoint takes no filter, so a filtered question is answered by
# the graph over the whole (small) collection.
- name: workflowsByRepo
  kind: remote
  operation: actions/list-repo-workflows
  records: "$.workflows[*]"
  keyArgs: [owner, repo]
  keySplit: "/"
  echoKeyAs: repository
  batchSafe: false
  args:
    per_page: 100
  paging: { style: page, param: page, sizeParam: per_page, size: 100, maxPages: 3 }
  project:
    id: id
    name: name
    path: path
    state: state
    html_url: html_url
  cost: { bucket: github-core, rate: 5000/hour }
  cache: { kind: ttl, seconds: 21600, negativeTtlSeconds: 3600 }

# Jobs of ONE run, every attempt (filter=all), so a retry shows as the same job name twice
# with two conclusions. The endpoint wants owner, repo AND run_id and a job record carries
# none of the three flat, so the WorkflowJob join composes the run's owner, repo and id into
# ONE key per run (producerKeyFields); the engine splits that composite on its own separator
# and the three parts land on the three path params in keyArgs order. echoKeyAs stamps the
# composite back on each job as runKey — the join link, and the first part of the key the
# job's annotations are then fetched by.
- name: jobsByRun
  kind: remote
  operation: actions/list-jobs-for-workflow-run
  records: "$.jobs[*]"
  keyArgs: [owner, repo, run_id]
  echoKeyAs: runKey
  batchSafe: false
  args:
    filter: all
    per_page: 100
  paging: { style: page, param: page, sizeParam: per_page, size: 100, maxPages: 3 }
  project:
    id: id
    run_id: run_id
    run_attempt: run_attempt
    name: name
    status: status
    conclusion: conclusion
    started_at: started_at
    completed_at: completed_at
    runner_name: runner_name
    runner_group_name: runner_group_name
    labels: "labels[*]"
    workflow_name: workflow_name
    head_branch: head_branch
    html_url: html_url
    step_names: "steps[*].name"
    step_conclusions: "steps[*].conclusion"
  cost: { bucket: github-core, rate: 5000/hour }
  # The jobs of a completed run never change; six hours is the window for the rare run still in
  # progress when it was opened. The envelope reports when each run's jobs were read.
  cache: { kind: ttl, seconds: 21600, negativeTtlSeconds: 600 }

# The commit ONE run built. Composite key from the run (owner, repo, head_sha) onto the three
# path parameters; echoKeyAs stamps it back as commitKey. A commit is immutable: cached a week.
- name: commitBySha
  kind: remote
  operation: repos/get-commit
  records: "$"
  keyArgs: [owner, repo, ref]
  echoKeyAs: commitKey
  batchSafe: false
  project:
    sha: sha
    message: commit.message
    authorLogin: author.login
    authorType: author.type
    committedAt: commit.committer.date
    verified: commit.verification.verified
    authorName: commit.author.name
    authoredAt: commit.author.date
    additions: stats.additions
    deletions: stats.deletions
    files: "files[*].filename"
    fileStatuses: "files[*].status"
    parents: "parents[*].sha"
    url: html_url
  compute:                           # the dev vocabulary's Commit contract; `r` is GitHub's commit plus what project lifted
    repositoryKey: "'github.com/' + toLower(split(r.html_url, '/')[3] + '/' + split(r.html_url, '/')[4])"
    key: "'github.com/' + toLower(split(r.html_url, '/')[3] + '/' + split(r.html_url, '/')[4]) + '@' + r.sha"
    projectKey: "'https://github.com/' + split(r.html_url, '/')[3] + '/' + split(r.html_url, '/')[4] + '@' + r.sha"
    title: "split(coalesce(r.message, ''), '\\n')[0]"
    coAuthors: "[l IN split(coalesce(r.message, ''), '\\n') WHERE toLower(l) STARTS WITH 'co-authored-by:' | trim(substring(l, 15))]"
    authorKind: "CASE WHEN r.authorType = 'Bot' AND any(a IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(coalesce(r.authorLogin, '')) CONTAINS a) THEN 'agent' WHEN r.authorType = 'Bot' OR coalesce(r.authorLogin, '') ENDS WITH '[bot]' THEN 'bot' WHEN any(l IN split(coalesce(r.message, ''), '\\n') WHERE toLower(l) STARTS WITH 'co-authored-by:' AND any(a IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(l) CONTAINS a)) THEN 'assisted' WHEN r.authorType = 'User' THEN 'human' ELSE 'unknown' END"
    committedAt: "r.committedAt"
    isMerge: "size(coalesce(r.parents, [])) > 1"
    isRevert: "coalesce(r.message, '') STARTS WITH 'Revert '"
    revertsSha: "coalesce(head([l IN split(coalesce(r.message, ''), '\\n') WHERE l STARTS WITH 'This reverts commit ' | split(substring(l, 20), '.')[0]]), '')"
    filesChanged: "size(coalesce(r.files, []))"
    sourceUrl: "r.html_url"
  cost: { bucket: github-core, rate: 5000/hour }
  cache: { kind: ttl, seconds: 604800, negativeTtlSeconds: 3600 }

# Annotations of ONE job. A job id IS its check-run id. The CheckAnnotation join composes the
# job's runKey (itself owner+repo+run_id) with the job id, so the composite splits into four
# parts: owner, repo, run_id, check_run_id. run_id is not a parameter this operation declares,
# so it is named only to keep the split aligned and is never sent.
- name: annotationsByJob
  kind: remote
  operation: checks/list-annotations
  records: "$[*]"
  keyArgs: [owner, repo, run_id, check_run_id]
  echoKeyAs: jobKey
  batchSafe: false
  args:
    per_page: 100
  project:
    annotation_level: annotation_level
    title: title
    message: message
    path: path
    start_line: start_line
    raw_details: raw_details
  # GitHub sends '' rather than null for a title or detail the action did not supply. That empty
  # string is the API's "none", not text, so it lands as null: count(a.title) counts the titled
  # annotations, and `a.title IS NULL` finds the untitled ones.
  compute:
    title: "CASE r.title WHEN '' THEN null ELSE r.title END"
    raw_details: "CASE r.raw_details WHEN '' THEN null ELSE r.raw_details END"
  cost: { bucket: github-core, rate: 5000/hour }
  # Annotations of a finished check run never change.
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 3600 }

# THE HISTORY DOOR. Completed runs never change, so history is read as calendar DAYS
# (`created=YYYY-MM-DD`) and a closed day is cached (400 days, in the world's store); only TODAY
# refreshes, one page, every 30 minutes. 62 days always reaches back past the start of the
# previous calendar month, so "this month" and "last month" are both whole. ONE producer, because
# a relationship is answered by exactly one join: a second producer declared on the same
# relationship is never consulted. A month-only design was tried first: it re-read the whole
# current month — 15 pages for a busy repository — every time the open period expired. Now the
# steady state is one small call per repository.
- name: runRecentByRepo
  kind: remote
  operation: actions/list-workflow-runs-for-repo
  records: "$.workflow_runs[*]"
  keyArgs: [owner, repo]
  keySplit: "/"
  echoKeyAs: repository
  batchSafe: false
  args:
    per_page: 100
  paging: { style: page, param: page, sizeParam: per_page, size: 100, maxPages: 5 }    # a day of up to 500 runs; more is reported PARTIAL by day
  periods: { param: created, unit: day, count: 62, lag: 0, stampAs: day }
  project:
    id: id
    name: name
    workflow_id: workflow_id
    path: path
    display_title: display_title
    head_branch: head_branch
    head_sha: head_sha
    event: event
    status: status
    conclusion: conclusion
    run_number: run_number
    run_attempt: run_attempt
    created_at: created_at
    run_started_at: run_started_at
    updated_at: updated_at
    html_url: html_url
    actor: actor.login
    actorType: actor.type
    pr_numbers: "pull_requests[*].number"
    owner: repository.owner.login
    repo: repository.name
  compute:                           # the dev vocabulary's Build contract (realm-dev-vocabulary/types/vocabulary.yml); `r` is the run as GitHub hands it over plus what project lifted
    repositoryKey: "'github.com/' + toLower(split(r.html_url, '/')[3] + '/' + split(r.html_url, '/')[4])"
    number: "r.run_number"
    attempt: "r.run_attempt"
    status: "CASE r.status WHEN 'completed' THEN 'completed' WHEN 'in_progress' THEN 'running' ELSE 'queued' END"
    conclusion: "CASE r.conclusion WHEN 'timed_out' THEN 'timed-out' WHEN 'success' THEN 'success' WHEN 'failure' THEN 'failure' WHEN 'cancelled' THEN 'cancelled' WHEN 'skipped' THEN 'skipped' WHEN null THEN '' ELSE 'other' END"
    trigger: "CASE r.event WHEN 'push' THEN 'push' WHEN 'pull_request' THEN 'change-request' WHEN 'pull_request_target' THEN 'change-request' WHEN 'schedule' THEN 'schedule' WHEN 'workflow_dispatch' THEN 'manual' WHEN 'release' THEN 'tag' ELSE 'other' END"
    branch: "r.head_branch"
    sha: "r.head_sha"
    changeRequestKeys: "[n IN coalesce(r.pr_numbers, []) | 'github.com/' + toLower(split(r.html_url, '/')[3] + '/' + split(r.html_url, '/')[4]) + '#' + toString(n)]"
    actorLogin: "r.actor"
    actorKind: "CASE WHEN r.actorType = 'Bot' AND any(a IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(coalesce(r.actor, '')) CONTAINS a) THEN 'agent' WHEN r.actorType = 'Bot' OR coalesce(r.actor, '') ENDS WITH '[bot]' THEN 'bot' WHEN r.actorType = 'User' THEN 'human' ELSE 'unknown' END"
    queuedAt: "r.created_at"
    startedAt: "r.run_started_at"
    finishedAt: "CASE r.status WHEN 'completed' THEN r.updated_at ELSE '' END"
    sourceUrl: "r.html_url"
  cost: { bucket: github-core, rate: 5000/hour }
  cache: { kind: ttl, seconds: 1800, negativeTtlSeconds: 1800 }
